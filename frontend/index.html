<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeStay | Premium Hotel Booking</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">LuxeStay.</div>
        <div class="nav-links">
            <a href="#">Trang chủ</a>
            <a href="#">Khách sạn</a>
            <a href="#">Khuyến mãi</a>
            <button class="btn-primary">Đăng nhập</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1>Trải nghiệm sự xa hoa.</h1>
            <p>Khám phá và đặt phòng tại những khách sạn đẳng cấp nhất thế giới ngay hôm nay.</p>
            <div class="search-bar">
                <input type="text" placeholder="Bạn muốn đi đâu? (VD: Nha Trang)" id="searchInput">
                <button class="btn-primary" onclick="searchHotels()">Tìm kiếm</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <section class="section-header">
            <h2>Khách sạn Nổi bật</h2>
            <p>Những điểm đến được đánh giá cao nhất bởi khách hàng.</p>
        </section>

        <!-- Loading Indicator -->
        <div id="loader" class="loader"></div>

        <!-- Hotels Grid -->
        <div class="hotels-grid" id="hotelsGrid">
            <!-- Hotels will be injected here via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 LuxeStay. Đồ án IE221 - Kỹ thuật Lập trình Python.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
